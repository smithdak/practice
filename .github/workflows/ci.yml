name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Only skills/evals/validate.py needs a third-party package.
      - run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Release validation
        run: python3 scripts/validate.py --release
      - name: Artifact schemas
        run: python3 scripts/validate_artifacts.py
      - name: Skill eval definitions
        run: python3 skills/evals/validate.py --root .
      - name: Links and as-of dates
        run: python3 scripts/check_links.py
