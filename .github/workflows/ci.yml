name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: tests/test_release_brief.py regenerates the committed
          # Phase 2 brief over a commit range and skips itself on a shallow
          # clone, which would silently drop the brief-versus-generator guard.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The eval validators, the agent registry, the packet contract, and the
      # triage records all parse YAML.
      - run: python3 -m pip install --disable-pip-version-check PyYAML
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Release validation
        run: python3 scripts/validate.py --release
      - name: Artifact schemas
        run: python3 scripts/validate_artifacts.py
      - name: Skill eval definitions
        run: python3 skills/evals/validate.py --root .
      - name: Agent registry bounds
        run: python3 scripts/validate_agents.py --root .
      - name: Agent eval definitions
        run: python3 scripts/validate_agent_evals.py --root .
      - name: Triage records
        run: python3 scripts/triage.py validate ops/triage --root .
      - name: Ledger entries
        run: python3 scripts/ledger.py validate ops/ledger --root .
      - name: Demotion triggers
        run: python3 scripts/demotion_check.py --root .
      - name: Links and as-of dates
        run: python3 scripts/check_links.py
