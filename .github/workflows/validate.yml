name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install PyYAML
      - run: python3 -m unittest discover -s tests
      - run: python3 scripts/validate.py --release
      - run: python3 skills/evals/validate.py --root .
